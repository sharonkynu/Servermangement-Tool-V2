version: '3.8'
services:
  voip_server:
    image: voip_server:latest
    environment:
      - H323_ENABLED=false
      - SIP_ENABLED=false
      - H323_PORT=8111
      - SIP_PORT=4441
      - MAX_CONNECTIONS=100
      - LOG_LEVEL=debug
      - PRIVATE_IP=192.168.1.1110
      - PUBLIC_IP=203.0.113.2222
    ports:
      - "6000:6000"
      - "5060:5060"


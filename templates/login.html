<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - System Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script>
    (function () {
      let savedTheme = localStorage.getItem('theme');
      if (!savedTheme || savedTheme === 'system') {
        savedTheme = 'light';
        localStorage.setItem('theme', savedTheme);
      }
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body class="split-login">

  <div class="login-logo-top">
    <img src="{{ url_for('static', filename='img/logo-tst.svg') }}" alt="Logo">
  </div>

  <div class="top-right-controls">
    <button id="theme-icon-btn" class="theme-icon-btn" onclick="toggleThemeCycle()" title="Toggle Theme">
      <span class="material-symbols-rounded">light_mode</span>
    </button>
  </div>

  <div class="split-container">
    <div class="split-left">
      <div class="brand-title">System<br>Management</div>
    </div>

    <div class="split-right">
      <div class="form-wrapper">
        <h1>Sign In</h1>
        <p class="subheader">Welcome back! Please sign in to your account</p>

        <div class="flash-messages">
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">
            {{ message }}
          </div>
          {% endfor %}
          {% endif %}
          {% endwith %}
        </div>

        <form method="POST" autocomplete="off">
          <div class="form-group">
            <label>Username</label>
            <div class="input-container">
              <input type="text" name="username" placeholder="Enter your username" required>
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-container">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <span class="material-symbols-rounded toggle-password" onclick="togglePassword()">visibility_off</span>
            </div>
          </div>

          <button type="submit" class="btn-continue">Continue</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const themes = ['light', 'dark'];
    const icons = { 'light': 'light_mode', 'dark': 'dark_mode' };

    function updateThemeIcon(theme) {
      const btn = document.getElementById('theme-icon-btn');
      if (btn) {
        btn.innerHTML = `<span class="material-symbols-rounded">${icons[theme]}</span>`;
      }
    }

    function changeTheme(value) {
      localStorage.setItem('theme', value);
      document.documentElement.setAttribute('data-theme', value);
    }

    function toggleThemeCycle() {
      let current = localStorage.getItem('theme');
      if (!current || !themes.includes(current)) current = 'light';
      let nextIndex = (themes.indexOf(current) + 1) % themes.length;
      let nextTheme = themes[nextIndex];
      changeTheme(nextTheme);
      updateThemeIcon(nextTheme);
    }

    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }

    // Initialize icon
    let currentTheme = localStorage.getItem('theme');
    if (!currentTheme || !themes.includes(currentTheme)) {
      currentTheme = 'light';
      localStorage.setItem('theme', currentTheme);
    }
    updateThemeIcon(currentTheme);

    document.addEventListener('DOMContentLoaded', function () {
      const form = document.querySelector('form');
      const submitBtn = document.querySelector('.btn-continue');

      if (form && submitBtn) {
        form.addEventListener('submit', function () {
          submitBtn.innerHTML = '<span class="material-symbols-rounded submitting-spinner">progress_activity</span>';
          submitBtn.classList.add('submitting-btn');
        });
      }
    });
  </script>
</body>

</html>
>
